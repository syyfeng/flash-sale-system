# ============================================================
# Nginx - Edge Rate Limiting for Flash Sale System
# ============================================================
# WHY NGINX RATE LIMITING:
# The first layer of defense against traffic spikes.
# Before any request reaches Spring Cloud Gateway, Nginx
# limits the burst to protect downstream services.
# ============================================================

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # --- Rate Limiting Zone ---
    # $binary_remote_addr = per-IP limiting (16 bytes per entry)
    # rate=200r/s = 200 requests/second per IP
    # zone=flash_limit:10m = 10MB shared memory (~160k IPs)
    limit_req_zone $binary_remote_addr zone=flash_limit:10m rate=200r/s;

    # Global rate limit for the entire flash-sale endpoint
    # $server_name = shared across all IPs
    limit_req_zone $server_name zone=global_flash:1m rate=5000r/s;

    upstream gateway {
        server gateway:8080;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # --- Flash Sale API endpoints ---
        location /api/ {
            # Per-IP: allow burst of 50, no delay for first 20
            limit_req zone=flash_limit burst=50 nodelay;

            # Global: allow burst of 2000
            limit_req zone=global_flash burst=2000 nodelay;

            # Custom error for rate-limited requests
            limit_req_status 429;

            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # --- Frontend (catch-all) ---
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Custom 429 error page
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error": "Too many requests. Please try again later."}';
        }
    }
}
