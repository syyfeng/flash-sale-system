services:

  # ============================================================
  # Infrastructure
  # ============================================================

  # 1. MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: flash-sale-mysql
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flash_sale
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - flash-net

  # 2. Redis
  redis:
    image: redis:alpine
    container_name: flash-sale-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flash-net

  # 3. Zookeeper (Confluent image)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: flash-sale-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - flash-net

  # 4. Kafka (Confluent image)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: flash-sale-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - flash-net

  # 5. Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: flash-sale-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - flash-net

  # ============================================================
  # Application Services
  # ============================================================

  # 6. Eureka Discovery Server
  discovery:
    build:
      context: .
      dockerfile: flash-sale-discovery/Dockerfile
    container_name: flash-sale-discovery
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: discovery
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - flash-net

  # 7. Spring Cloud Gateway
  gateway:
    build:
      context: .
      dockerfile: flash-sale-gateway/Dockerfile
    container_name: flash-sale-gateway
    ports:
      - "8080:8080"
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    networks:
      - flash-net

  # 8. Inventory Service (REST + gRPC server)
  inventory:
    build:
      context: .
      dockerfile: flash-sale-inventory/Dockerfile
    container_name: flash-sale-inventory
    ports:
      - "8081:8081"
      - "9090:9090"
    depends_on:
      discovery:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/flash_sale?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    networks:
      - flash-net

  # 9. Order Service (REST + gRPC client)
  order:
    build:
      context: .
      dockerfile: flash-sale-order/Dockerfile
    container_name: flash-sale-order
    ports:
      - "8082:8082"
    depends_on:
      discovery:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/flash_sale?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    networks:
      - flash-net

  # 10. Frontend (React / Vite)
  frontend:
    build:
      context: ./flash-sale-frontend
      dockerfile: Dockerfile
    container_name: flash-sale-frontend
    networks:
      - flash-net

  # 0. Nginx - Edge Rate Limiting (Layer 1) + Frontend Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: flash-sale-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - frontend
    networks:
      - flash-net

networks:
  flash-net:
    driver: bridge
